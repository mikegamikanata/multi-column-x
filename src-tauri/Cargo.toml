[package]
name = "multicolumnx"
version = "0.8.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "multi_column_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Android アプリ更新の動作試験用。有効時のみ APK URL としてローカル配信サーバー（8787）を許可する。
# 配布ビルドでは有効にしないこと。
updater-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
url = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# reqwest を rustls-no-provider で使うため、暗号プロバイダ（ring）を直接指定する。default-features は aws-lc-rs を含むので無効にする。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Android の HTTPS 検証に使う同梱ルート証明書（desktop のテストでも参照するため全ターゲット）。
webpki-root-certs = "1"
m3u8-rs = "6"
sys-locale = "0.3.2"

[dev-dependencies]
# プロパティベーステスト（純粋関数の不変条件検証）
proptest = "1"
# 動画ダウンロードのHTTP I/O層のテスト用モックHTTPサーバ
wiremock = "0.6"
# 設定ファイルの破損耐性テスト用の一時ディレクトリ
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

# Linux: カラム WebView（独立 WebviewWindow）の WebProcess クラッシュ検知
# （connect_web_process_terminated）とフォーカス検知（connect_focus_in_event）のため、
# wry と同一バージョンの webkit2gtk / gtk を直接参照する（型を一致させるためピン留め）。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = { version = "=0.18.2" }
# AppImage向け Cisco OpenH264 ランタイムダウンロード機能（SHA256検証・bzip2展開）で使用
sha2 = "0.11"
bzip2 = "0.6"
# AppImage 再起動（relaunch_app）で子プロセスを切り離す setsid / 継承 fd の close / fcntl に使う
libc = "0.2"

# Windows: カラム WebView がフォーカスを得たことを検知するため、tauri-runtime-wry
# と同一バージョンの webview2-com を直接参照する（型を一致させるためバージョンをピン留め）。
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
# 拡張機能 API ブリッジ（HSTRING / Interface::cast / BOOL）用。webview2-com 0.39.1 と同一バージョン系。
windows-core = "0.62"

# 自動更新はデスクトップのみ。Android は APK 自己更新を別実装する。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# 動画ダウンロードの保存先ダイアログはデスクトップのみ。Android は Kotlin 側 SAF で別実装する。
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
